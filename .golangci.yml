version: "2"

linters:
  default: all
  disable:
    - inamedparam
    - gochecknoinits
    - wsl
    - wsl_v5
    - whitespace
    - wrapcheck
    - exhaustruct
    - exhaustruct_v5
    - err113
    - testpackage
    - depguard
    - paralleltest
    - varnamelen
    - forbidigo
    - funlen
    - gochecknoglobals
    - godox
    - lll
    - mnd
    - noinlineerr
    # nlreturn enforces a blank line before every return/branch statement.
    # wsl, wsl_v5, and whitespace (the other blank-line-shape linters) are
    # already disabled above; keeping nlreturn alone is inconsistent with
    # that call and adds no defect coverage, just reformatting churn.
    - nlreturn
    # ireturn flags functions that return an interface. Returning
    # Authorizer/Privilege from the authz package's factories is that
    # package's deliberate design (pluggable authorization backends), not
    # an oversight to fix.
    - ireturn
    # gomodguard is deprecated in favor of gomodguard_v2 (enabled below).
    - gomodguard
    # containedctx flags every struct with a context.Context field. All three
    # occurrences in this codebase (oidc.RefreshingClientCredentialsTokenSource,
    # fileTokenSource, waitingTokenSource) exist because they implement
    # oauth2.TokenSource, whose Token() method takes no context — storing ctx
    # at construction is the only way to thread one through, not an oversight.
    - containedctx
    # nonamedreturns flags every named return, but none of this codebase's
    # occurrences rely on a naked `return` (the actual bug risk named
    # returns can introduce) — they're all explicit `return values...`, and
    # the names document what each position in a multi-value return (e.g.
    # bool, string, string, string) means.
    - nonamedreturns
    # contextcheck's remaining findings here are either the same
    # oauth2.TokenSource constraint as containedctx above, an optional ctx
    # parameter that legitimately defaults to context.Background() when the
    # caller passes nil, or middleware that derives its context through an
    # AuthRequestFunc value (http/authmw.Wrap and friends) — the linter
    # can't trace context provenance through that indirection, but every
    # implementation does correctly derive from r.Context().
    - contextcheck
  enable:
    - gomodguard_v2
  settings:
    tagliatelle:
      case:
        rules:
          json: snake
    cyclop:
      # Default is 10. The remaining functions at 11-13 here are all flat,
      # single-level validation chains, type switches, or field-by-field
      # builders (e.g. jwt.validatedClaimsToMapClaims's "if field != zero {
      # set it }" sequence) — genuinely simple to read despite the branch
      # count. Splitting them would fragment cohesive logic into
      # disconnected helpers for no readability gain. 13 clears those while
      # still catching functions with real nested complexity.
      max-complexity: 13
  exclusions:
    rules:
      # authz/prefixlist mirrors third-party vendor JSON schemas (AWS
      # ip-ranges.json, Google Cloud's published ranges, Fastly's IP
      # list, etc.) verbatim. Renaming those tags to match our own
      # convention wouldn't just be a style change, it would break
      # parsing of upstream data we don't control.
      - path: 'authz/prefixlist/'
        linters:
          - tagliatelle
      # Test fixture literals ("sub", "admin", role names, etc.) are not
      # a maintenance risk the way repeated strings in production code
      # are; constant-izing them adds indirection without reducing risk.
      - path: '_test\.go'
        linters:
          - goconst
      # noctx flags httptest.NewRequest and similar test-only helpers for
      # not carrying a context. No request built this way ever leaves the
      # process, so there is no cancellation/deadline to propagate.
      - path: '_test\.go'
        linters:
          - noctx
      # gosec's G101 (hardcoded credentials) false-positives on fake JWTs
      # and struct field names like TokenEndpoint; G124 flags a cookie built
      # to send as part of a test *request*, not a response Set-Cookie; G306
      # fires on a file permission test deliberately writing 0644 to verify
      # the code under test rejects it. The standalone `gosec ./...` step in
      # the Makefile already excludes test files by default and passes
      # clean; this mirrors that for golangci-lint's bundled gosec.
      - path: '_test\.go'
        linters:
          - gosec
      # imported_netrc.go is verbatim vendored code from the Go toolchain
      # (cmd/go/internal/auth/netrc.go, BSD-licensed, per its own file
      # header). Refactoring parseNetrc to reduce complexity would only
      # create drift from upstream for no benefit.
      - path: 'http/basic/imported_netrc\.go'
        linters:
          - cyclop

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
